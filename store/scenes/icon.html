<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:512px; height:512px; overflow:hidden; }
body { background:#2563eb; display:flex; align-items:center; justify-content:center;
  font-family:Inter,"Segoe UI",Arial,sans-serif; }
.card { width:320px; background:#fff; border-radius:28px; padding:42px 40px; box-shadow:0 20px 50px rgba(0,0,0,.18); }
.title { height:26px; width:100%; background:#2563eb; border-radius:7px; }
.url { height:14px; width:55%; background:#1a9e4b; border-radius:5px; margin-top:22px; }
.line { height:14px; background:#cfd4dc; border-radius:5px; margin-top:16px; }
.l1 { width:100%; } .l2 { width:86%; } .l3 { width:64%; }
</style>
</head>
<body>
  <div class="card">
    <div class="title"></div>
    <div class="url"></div>
    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
  </div>
</body>
</html>
